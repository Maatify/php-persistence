name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      exploratory:
        description: Also run the exploratory (non-required) MySQL Innovation cell
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COMPOSER_NO_INTERACTION: "1"

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install actionlint 1.7.12 (pinned, checksum verified)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - name: Lint every workflow and local action
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/actionlint" -color .github/workflows/*.yml

  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-php-composer
        with:
          php-version: "8.4"
      - name: Composer validate --strict
        run: composer validate --strict
      - name: Resolve dependencies (no committed lock file)
        run: composer update --prefer-stable --no-progress
      - name: Platform requirements (nothing ignored)
        run: composer check-platform-reqs
      - name: Strict PSR-4 autoload
        run: composer dump-autoload --optimize --strict-psr
      - name: No tracked lock file, vendor or caches
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(composer\.lock|vendor/)|\.cache'; then
            echo "disposable files are tracked" >&2
            exit 1
          fi
      - name: PHP syntax
        run: composer syntax
      - name: Whitespace
        run: composer whitespace

  compat:
    name: Compat PHP ${{ matrix.php }} ${{ matrix.dependencies }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
        dependencies: [latest, lowest]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-php-composer
        with:
          php-version: ${{ matrix.php }}
      - name: Resolve ${{ matrix.dependencies }} dependencies
        env:
          DEPENDENCIES: ${{ matrix.dependencies }}
        run: |
          set -euo pipefail
          if [ "$DEPENDENCIES" = "lowest" ]; then
            composer update --prefer-lowest --prefer-stable --no-progress
          else
            composer update --prefer-stable --no-progress
          fi
          composer show --direct
      - name: Platform requirements (nothing ignored)
        run: composer check-platform-reqs
      - name: Dependency policy is configured fail-closed
        run: |
          set -euo pipefail
          for variable in COMPOSER_POLICY COMPOSER_NO_BLOCKING COMPOSER_NO_AUDIT COMPOSER_AUDIT_ABANDONED COMPOSER_POLICY_ADVISORIES_BLOCK COMPOSER_POLICY_MALWARE_BLOCK; do
            if [ -n "${!variable:-}" ]; then
              echo "$variable weakens the dependency policy" >&2
              exit 1
            fi
          done
          composer config policy | jq -e '
            .advisories.block == true and .advisories.audit == "fail"
            and .malware.block == true and .malware["block-scope"] == "all" and .malware.audit == "fail"
            and .abandoned.audit == "fail"'
      - name: Composer audit (advisories, malware, abandoned)
        run: composer audit --no-interaction --abandoned=fail
      - name: Static analysis (PHPStan max)
        run: composer analyse
      - name: Code style and PER-CS 3.1 checks
        run: composer format:check
      - name: Unit suite
        run: composer test:unit
      - name: Regression suite (includes the PER-CS 3.1 pipe operator fixtures on PHP 8.5)
        run: composer test:regression

  integration:
    name: Integration ${{ matrix.cell }} PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cell: mysql-8.0.16, php: "8.4" }
          - { cell: mysql-8.0.16, php: "8.5" }
          - { cell: mysql-8.4.13, php: "8.4" }
          - { cell: mysql-9.7.4, php: "8.4" }
          - { cell: mysql-9.7.4, php: "8.5" }
          - { cell: mariadb-10.11.19, php: "8.4" }
          - { cell: mariadb-10.11.19, php: "8.5" }
          - { cell: mariadb-11.4.13, php: "8.4" }
          - { cell: mariadb-11.8.9, php: "8.4" }
          - { cell: mariadb-12.3.3, php: "8.4" }
          - { cell: mariadb-12.3.3, php: "8.5" }
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-php-composer
        with:
          php-version: ${{ matrix.php }}
      - name: Resolve dependencies
        run: composer update --prefer-stable --no-progress
      - name: Integration suite on ${{ matrix.cell }} (two fresh lifecycles, two suite passes each)
        env:
          PP_DB_CELL: ${{ matrix.cell }}
        run: composer test:integration -- --fresh-runs=2
      - name: No Compose resources remain
        if: always()
        run: |
          set -euo pipefail
          test -z "$(docker ps -aq --filter 'label=com.docker.compose.project')"
          test -z "$(docker volume ls -q --filter 'label=com.docker.compose.project')"

  examples-smoke:
    name: Examples smoke (${{ matrix.cell }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cell: [mysql-8.4.13, mariadb-11.8.9]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-php-composer
        with:
          php-version: "8.4"
      - name: Resolve dependencies
        run: composer update --prefer-stable --no-progress
      - name: Smoke-execute examples/ against a real disposable database (reuses the Integration Compose definition)
        env:
          PP_DB_CELL: ${{ matrix.cell }}
        run: composer examples:smoke
      - name: No Compose resources remain
        if: always()
        run: |
          set -euo pipefail
          test -z "$(docker ps -aq --filter 'label=com.docker.compose.project')"
          test -z "$(docker volume ls -q --filter 'label=com.docker.compose.project')"

  exploratory:
    name: Exploratory MySQL Innovation (not required)
    if: github.event_name == 'workflow_dispatch' && inputs.exploratory
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-php-composer
        with:
          php-version: "8.5"
      - run: composer update --prefer-stable --no-progress
      - name: Integration suite on the exploratory cell
        env:
          PP_DB_CELL: mysql-26.10.0
        run: composer test:integration

  ci-gate:
    name: CI gate
    if: always()
    needs: [workflow-lint, static, compat, integration, examples-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
