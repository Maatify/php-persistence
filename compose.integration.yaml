# Disposable MySQL/MariaDB service for the Integration suite.
# One definition for every engine and version: the image reference comes from
# docker/integration-matrix.json through scripts/integration.php (composer test:integration).
# No fixed container name, no fixed host port, no production credentials.
name: ${PP_COMPOSE_PROJECT:?started through scripts/integration.php}

services:
  database:
    image: ${PP_DB_IMAGE:?started through scripts/integration.php}
    environment:
      MYSQL_ROOT_PASSWORD: ${PP_DB_ROOT_PASSWORD:?started through scripts/integration.php}
      MYSQL_DATABASE: ${PP_DB_DATABASE:?started through scripts/integration.php}
      MYSQL_USER: ${PP_DB_USER:?started through scripts/integration.php}
      MYSQL_PASSWORD: ${PP_DB_PASSWORD:?started through scripts/integration.php}
      MARIADB_ROOT_PASSWORD: ${PP_DB_ROOT_PASSWORD:?started through scripts/integration.php}
      MARIADB_DATABASE: ${PP_DB_DATABASE:?started through scripts/integration.php}
      MARIADB_USER: ${PP_DB_USER:?started through scripts/integration.php}
      MARIADB_PASSWORD: ${PP_DB_PASSWORD:?started through scripts/integration.php}
    ports:
      - "127.0.0.1::3306"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          for client in mariadb-admin mysqladmin; do
          if command -v "$$client" >/dev/null 2>&1; then
          exec "$$client" ping --host=127.0.0.1 --user=root --password="$$MYSQL_ROOT_PASSWORD" --silent;
          fi;
          done;
          exit 1
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 5s
